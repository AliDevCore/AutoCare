name: Build AutoCare Android APKs (Debug & Release)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug

      - name: 🔑 Set up Release Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            echo "KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set in GitHub Secrets. Release build will fail if executed without key."
          fi

      - name: 🚀 Build Release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: 📦 Prepare Output APKs
        run: |
          mkdir -p output_apks
          # Copy Debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_apks/AutoCare-Debug.apk
          fi
          # Copy Release APK (signed)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output_apks/AutoCare-Release.apk
          fi
          ls -la output_apks/

      - name: 🧹 Clean up Keystore
        if: always()
        run: rm -f /tmp/release.keystore

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCare-Debug-APK
          path: output_apks/AutoCare-Debug.apk
          retention-days: 14

      - name: 📤 Upload Release APK Artifact
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AutoCare-Release-APK
          path: output_apks/AutoCare-Release*.apk
          retention-days: 14

      - name: 📤 Upload All APKs (Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: AutoCare-All-APKs
          path: output_apks/
          retention-days: 30

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "نسخه رسمی AutoCare v1.0.${{ github.run_number }}"
          body: |
            ### 🚗 دانلود مستقیم نسخه اپلیکیشن AutoCare
            - فایل‌های نصبی تولیدشده در این نسخه در پیوست قرار دارند.
          draft: false
          prerelease: false
          make_latest: true
          files: output_apks/*.apk
