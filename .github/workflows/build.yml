name: Build AutoCare Android APKs (Debug & Release)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest
        continue-on-error: true

      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug

      - name: 🚀 Build Release APK
        run: ./gradlew assembleRelease

      - name: 📦 Prepare Output APKs
        run: |
          mkdir -p output_apks
          # Copy Debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_apks/AutoCare-Debug.apk
          fi
          # Copy Release APK (signed)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output_apks/AutoCare-Release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk output_apks/AutoCare-Release-unsigned.apk
          fi
          ls -la output_apks/

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCare-Debug-APK
          path: output_apks/AutoCare-Debug.apk
          retention-days: 14

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCare-Release-APK
          path: output_apks/AutoCare-Release*.apk
          retention-days: 14

      - name: 📤 Upload All APKs (Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: AutoCare-All-APKs
          path: output_apks/
          retention-days: 30

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "نسخه رسمی v1.0.0 | اتوکِر AutoCare"
          body: |
            ### 🚗 دانلود مستقیم نسخه نهایی اپلیکیشن AutoCare
            - **AutoCare-Release.apk**: نسخه نهایی و بهینه‌شده، امضاشده و آماده نصب مستقیم روی هر گوشی اندروید
            - **AutoCare-Debug.apk**: نسخه تست و دیباگ
          files: |
            output_apks/AutoCare-Release.apk
            output_apks/AutoCare-Debug.apk
